name: Release

# Merging a changeset to main opens a "Version Packages" pull request. Merging
# that pull request runs this again and publishes. Two merges, one release.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Push the version bump and open the release pull request.
      contents: write
      pull-requests: write
      # Required for npm provenance, and necessary but NOT sufficient: v0.1.0
      # published with this granted and still attached no attestations, because
      # changesets invokes `pnpm publish` itself so `--provenance` never reaches
      # the command line, and NPM_CONFIG_PROVENANCE is an npm-CLI environment
      # convention pnpm does not appear to honour. Nothing errors; provenance is
      # simply skipped. Being fixed properly in the trusted-publishing task —
      # verify against the registry (`dist.attestations`), never against a green
      # workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads git history to work out what has been released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # registry-url makes setup-node write an .npmrc that reads NODE_AUTH_TOKEN,
      # so no token is ever written into the repo.
      #
      # setup-node v7 removed its dummy NODE_AUTH_TOKEN export. That only
      # mattered when the variable was unset — this job sets it explicitly
      # below — but it is the same subsystem that broke the first release
      # attempt, so check here first if publish auth ever misbehaves again.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Belt and braces on provenance. `--provenance` is a real pnpm flag, and
      # NPM_CONFIG_PROVENANCE is the environment route that survives changesets
      # invoking the package manager on our behalf. Setting both costs nothing;
      # relying on one and being wrong ships an unattested first release.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is the name changesets/action@v1 checks to decide its auth
          # strategy. Without it the action logs "No NPM_TOKEN found, but OIDC is
          # available - using npm trusted publishing" and takes the trusted-
          # publishing path — which is not configured for these packages on
          # npmjs.com, so the registry falls back to demanding an OTP and the
          # publish dies with ERR_PNPM_OTP_NON_INTERACTIVE. That is exactly what
          # happened on the first release attempt (2026-08-29).
          #
          # NODE_AUTH_TOKEN is kept because actions/setup-node's registry-url
          # writes an .npmrc that reads it. Both names point at the same secret.
          NPM_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
