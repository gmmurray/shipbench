name: Release

# Merging a changeset to main opens a "Version Packages" pull request. Merging
# that pull request runs this again and publishes. Two merges, one release.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Push the version bump and open the release pull request.
      contents: write
      pull-requests: write
      # The OIDC token this exchanges for a registry credential is now the ONLY
      # way this job can authenticate — there is no npm token anywhere in the
      # workflow. It also signs the provenance attestation.
      #
      # It was granted for v0.1.0 too and that release still shipped unattested,
      # because provenance was requested through NPM_CONFIG_PROVENANCE, which
      # pnpm ignores. The permission was never the missing piece. Verify
      # provenance against the registry (`dist.attestations`), never against a
      # green workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads git history to work out what has been released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # registry-url is kept for the registry setting even though no token is
      # supplied. It writes an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`,
      # and that variable is now deliberately unset — pnpm 11.1.3+ treats an
      # unresolved ${VAR} placeholder as empty rather than sending it verbatim,
      # which is exactly the OIDC-alongside-setup-node case. On an older pnpm
      # this combination 404s.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # No npm credential. Auth is GitHub OIDC exchanged for a short-lived
      # registry token, per the trusted publisher configured for each package on
      # npmjs.com. pnpm 11.0.7+ attempts OIDC per package during recursive
      # publish and only falls back to a static token when OIDC is unavailable —
      # with no token present there is nothing to fall back to, so a broken OIDC
      # setup fails loudly instead of silently publishing unattested. That
      # silent fallback is precisely how v0.1.0 shipped without provenance.
      #
      # changesets/action v2 renamed every input used here and no longer reads
      # GITHUB_TOKEN from the environment; it must be a `github-token` input.
      - name: Version or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm release:version
          publish-script: pnpm release:publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
